<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>لوحة إدارة أكاديمية سنا</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    :focus-visible { outline: 3px solid #1d4ed8; outline-offset: 2px; }
    table { border-collapse: collapse; }
    th, td { border: 1px solid #9ca3af; padding: .35rem .5rem; text-align: start; }
    caption { text-align: start; font-weight: 700; padding: .25rem 0; }
  </style>
</head>
<body class="bg-white text-gray-900 text-base leading-relaxed">
<div x-data="dashboard()" class="max-w-6xl mx-auto p-4">

  <a href="#main" class="sr-only focus:not-sr-only underline">تخطَّ إلى المحتوى</a>

  <header class="mb-4">
    <h1 class="text-2xl font-bold">لوحة إدارة أكاديمية سنا</h1>
    <p x-show="test" x-cloak class="font-bold border-2 border-gray-900 p-2">وضع الاختبار: هذه بيانات مجلد الاختبار، لا بيانات الأكاديمية.</p>
    <p x-show="data" x-cloak>سنة <span x-text="data && data.year"></span>، وتاريخ اليوم <span x-text="data && data.today"></span>.</p>
  </header>

  <nav aria-label="أقسام اللوحة" class="mb-4">
    <ul class="flex flex-wrap gap-4 underline">
      <li><a href="#numbers">الأرقام</a></li>
      <li><a href="#students">الطلاب</a></li>
      <li><a href="#fix-name">تصحيح اسم</a></li>
      <li><a href="#rates">أسعار الساعة والمستحقات</a></li>
      <li><a href="#expenses">المصروفات</a></li>
    </ul>
  </nav>

  <p id="status" role="status" aria-live="polite" class="mb-2 font-bold" x-text="status"></p>
  <!-- Always in the DOM (empty when there is no error), so focus can move to it at once. -->
  <p id="error" role="alert" tabindex="-1" class="mb-2 font-bold text-red-800"
     :class="error ? 'border-2 border-red-800 p-2' : ''" x-text="error ? 'خطأ: ' + error : ''"></p>

  <main id="main" tabindex="-1">
  <template x-if="data"><div>

    <!-- 1. Numbers -->
    <section id="numbers" aria-labelledby="numbers-h" class="mb-8">
      <h2 id="numbers-h" tabindex="-1" class="text-xl font-bold mb-2">الأرقام</h2>
      <div class="overflow-x-auto">
        <table class="mb-4 text-sm">
          <caption>الإجمالي منذ بداية السجل</caption>
          <thead><tr><template x-for="h in data.totalsHeaders" :key="h"><th scope="col" x-text="h"></th></template></tr></thead>
          <tbody>
            <template x-for="(row, i) in data.totals" :key="i">
              <tr><template x-for="(cell, j) in row" :key="j">
                <th x-show="j === 0" scope="row" x-text="cell"></th>
                <td x-show="j > 0" x-text="cell"></td>
              </template></tr>
            </template>
          </tbody>
        </table>
      </div>

      <label for="month-select" class="font-bold">الشهر:</label>
      <select id="month-select" x-model="month" class="border border-gray-700 p-1 mb-2">
        <template x-for="m in months()" :key="m"><option :value="m" :selected="m === month" x-text="m"></option></template>
      </select>
      <div class="overflow-x-auto">
        <table class="text-sm">
          <caption x-text="'أرقام شهر ' + month"></caption>
          <thead><tr><template x-for="h in data.monthlyHeaders.slice(2)" :key="h"><th scope="col" x-text="h"></th></template></tr></thead>
          <tbody>
            <template x-for="(row, i) in monthRows()" :key="i">
              <tr><template x-for="(cell, j) in row.slice(2)" :key="j">
                <th x-show="j === 0" scope="row" x-text="cell"></th>
                <td x-show="j > 0" x-text="cell"></td>
              </template></tr>
            </template>
          </tbody>
        </table>
      </div>
    </section>

    <!-- 2. Students -->
    <section id="students" aria-labelledby="students-h" class="mb-8">
      <h2 id="students-h" tabindex="-1" class="text-xl font-bold mb-2">الطلاب</h2>
      <div class="flex flex-wrap gap-4 mb-2">
        <div>
          <label for="teacher-select" class="font-bold block">المعلم</label>
          <select id="teacher-select" x-model="teacher" class="border border-gray-700 p-1">
            <template x-for="t in data.teachers" :key="t.name"><option :value="t.name" :selected="t.name === teacher" x-text="t.name + ' (' + t.students.length + ')'"></option></template>
          </select>
        </div>
        <div>
          <label for="search" class="font-bold block">ابحث بالاسم</label>
          <input id="search" type="search" x-model="search" class="border border-gray-700 p-1" aria-describedby="search-count">
          <p id="search-count" x-text="filteredStudents().length + ' طالباً'"></p>
        </div>
        <div>
          <label for="absent-filter" class="font-bold block">اعرض</label>
          <select id="absent-filter" x-model="absentDays" class="border border-gray-700 p-1" aria-describedby="search-count">
            <option value="0">كل الطلاب</option>
            <option value="14">الغائبين أكثر من 14 يوماً</option>
            <option value="30">الغائبين أكثر من 30 يوماً</option>
          </select>
        </div>
      </div>
      <div class="overflow-x-auto">
        <table class="text-sm">
          <caption x-text="(absentDays === '0' ? 'طلاب ' : 'الغائبون أكثر من ' + absentDays + ' يوماً من طلاب ') + teacher + '، الأحدث حضوراً أولاً'"></caption>
          <thead><tr>
            <th scope="col">الاسم</th><th scope="col">الجنس</th><th scope="col">الفئة</th>
            <th scope="col">أول ظهور</th><th scope="col">آخر ظهور</th><th scope="col">أيام الغياب</th><th scope="col">الحضور</th>
            <th scope="col">آخر حفظ</th><th scope="col">الإعادة</th><th scope="col">الأوسمة</th>
            <th scope="col">السن</th><th scope="col">سنة الميلاد والهاتف</th>
          </tr></thead>
          <tbody>
            <template x-for="s in filteredStudents()" :key="s.key">
              <tr>
                <th scope="row"><span x-text="s.name"></span><span x-show="s.isNew"> (جديد)</span></th>
                <td>
                  <label :for="'g-' + s.key" class="sr-only" x-text="'جنس ' + s.name"></label>
                  <select :id="'g-' + s.key" x-model="genders[k(s)]" class="border border-gray-700 p-1">
                    <option value="ذكر">ذكر</option><option value="أنثى">أنثى</option>
                  </select>
                  <button type="button" class="border border-gray-900 px-2 ms-1 disabled:opacity-50"
                          :disabled="busy || genders[k(s)] === s.gender"
                          :aria-label="'احفظ جنس ' + s.name"
                          @click="saveGender(s)">احفظ</button>
                </td>
                <td x-text="s.category"></td><td x-text="s.firstSeen"></td><td x-text="s.lastSeen"></td>
                <td x-text="daysAway(s)"></td>
                <td x-text="s.attendance"></td><td x-text="s.lastHifz"></td>
                <td x-text="s.repeats"></td><td x-text="s.medals"></td>
                <td x-text="s.age === '' ? '' : s.age + ' سنة'"></td>
                <td>
                  <label :for="'by-' + s.key" class="sr-only" x-text="'سنة ميلاد ' + s.name"></label>
                  <input :id="'by-' + s.key" type="text" inputmode="numeric" maxlength="4" placeholder="سنة الميلاد"
                         x-model="details[k(s)].birthYear" class="border border-gray-700 p-1 w-24">
                  <label :for="'ph-' + s.key" class="sr-only" x-text="'هاتف ' + s.name"></label>
                  <input :id="'ph-' + s.key" type="tel" dir="ltr" placeholder="+20…"
                         x-model="details[k(s)].phone" class="border border-gray-700 p-1 w-40">
                  <button type="button" class="border border-gray-900 px-2 ms-1 disabled:opacity-50"
                          :disabled="busy || !detailsChanged(s)"
                          :aria-label="'احفظ سنة ميلاد وهاتف ' + s.name"
                          @click="saveDetails(s)">احفظ</button>
                  <a x-show="s.phone" :href="'https://wa.me/' + String(s.phone).replace(/\D/g, '')" target="_blank" rel="noopener"
                     class="underline ms-1" :aria-label="'راسل ' + s.name + ' على WhatsApp (يفتح في نافذة جديدة)'">WhatsApp</a>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </section>

    <!-- 3. Fix a name -->
    <section id="fix-name" aria-labelledby="fix-h" class="mb-8">
      <h2 id="fix-h" tabindex="-1" class="text-xl font-bold mb-2">تصحيح اسم</h2>
      <p class="mb-2">اختر المعلم المحدد في قسم الطلاب، ثم الاسم كما ورد خطأً، ثم الاسم الصحيح. يُدمج الصفان في الحال، ولا يُنقض الدمج.</p>
      <form @submit.prevent="reviewAlias()" class="flex flex-col gap-3 max-w-xl">
        <p>المعلم: <strong x-text="teacher"></strong></p>
        <div>
          <label for="alias-from" class="font-bold block">الاسم كما ورد (الخطأ)</label>
          <select id="alias-from" x-model="aliasFrom" required class="border border-gray-700 p-1 w-full">
            <option value="">-- اختر --</option>
            <template x-for="s in currentStudents()" :key="s.key">
              <option :value="s.name" x-text="s.name + (s.isNew ? ' (جديد)' : '') + '، حضر ' + s.attendance"></option>
            </template>
          </select>
        </div>
        <fieldset>
          <legend class="font-bold">الاسم الصحيح</legend>
          <label class="me-4"><input type="radio" value="list" x-model="aliasMode"> من طلاب المعلم</label>
          <label><input type="radio" value="typed" x-model="aliasMode"> أكتبه</label>
          <div x-show="aliasMode === 'list'" class="mt-2">
            <label for="alias-to-list" class="sr-only">الاسم الصحيح من القائمة</label>
            <select id="alias-to-list" x-model="aliasToList" class="border border-gray-700 p-1 w-full">
              <option value="">-- اختر --</option>
              <template x-for="s in currentStudents().filter(x => x.name !== aliasFrom)" :key="s.key">
                <option :value="s.name" x-text="s.name + '، حضر ' + s.attendance"></option>
              </template>
            </select>
          </div>
          <div x-show="aliasMode === 'typed'" class="mt-2">
            <label for="alias-to-typed" class="sr-only">اكتب الاسم الصحيح</label>
            <input id="alias-to-typed" type="text" x-model="aliasToTyped" class="border border-gray-700 p-1 w-full">
          </div>
        </fieldset>
        <button type="submit" class="border-2 border-gray-900 px-3 py-1 font-bold self-start" :disabled="busy">راجع قبل الدمج</button>
      </form>

      <div x-show="review" x-cloak id="alias-review" tabindex="-1" class="border-2 border-gray-900 p-3 mt-3 max-w-xl"
           role="group" aria-labelledby="review-h">
        <h3 id="review-h" class="font-bold">راجع الدمج</h3>
        <p x-text="review && reviewText()"></p>
        <div class="flex gap-3 mt-2">
          <button type="button" class="border-2 border-gray-900 px-3 py-1 font-bold" :disabled="busy" @click="confirmAlias()">ادمج الآن</button>
          <button type="button" class="border border-gray-900 px-3 py-1" @click="review = null; focusEl('alias-from')">إلغاء</button>
        </div>
      </div>

      <div class="overflow-x-auto mt-4">
        <table class="text-sm">
          <caption>الأسماء البديلة المحفوظة</caption>
          <thead><tr><th scope="col">المعلم</th><th scope="col">كما ورد</th><th scope="col">الصحيح</th><th scope="col">طُبّق</th><th scope="col">حذف</th></tr></thead>
          <tbody>
            <template x-for="(a, i) in data.aliases" :key="i">
              <tr>
                <td x-text="a.teacher"></td><th scope="row" x-text="a.from"></th><td x-text="a.to"></td>
                <td x-text="a.applied ? 'نعم' : 'لم يُطبَّق بعد'"></td>
                <td>
                  <button type="button" class="border border-gray-900 px-2" x-show="pendingDelete !== i"
                          :aria-label="'احذف البديل ' + a.from" @click="pendingDelete = i">احذف</button>
                  <button type="button" class="border-2 border-red-800 px-2 font-bold" x-show="pendingDelete === i"
                          :aria-label="'تأكيد حذف البديل ' + a.from + '؛ لا يفصل ما دُمج'" :disabled="busy"
                          @click="deleteAlias(a)">تأكيد الحذف</button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
        <p x-show="!data.aliases.length">لا بدائل بعد.</p>
      </div>
    </section>

    <!-- 4. Hourly rates and pay -->
    <section id="rates" aria-labelledby="rates-h" class="mb-8">
      <h2 id="rates-h" tabindex="-1" class="text-xl font-bold mb-2">أسعار الساعة والمستحقات</h2>
      <p class="mb-2">سعر الساعة بالجنيه، واحد لكل حلقات المعلم. ويُحسب بالسعر الحالي كل شهر لم يثبت بعد في الملف العام.</p>
      <p x-show="data.unpriced.length" class="font-bold mb-2"
         x-text="'لا سعر لـ: ' + data.unpriced.join('، ') + '. فمصروف الأشهر التي لهم فيها حلقات يبقى فارغاً في الملف العام حتى يُكتب سعرهم.'"></p>
      <div class="overflow-x-auto">
        <table class="text-sm">
          <caption>سعر الساعة لكل معلم</caption>
          <thead><tr><th scope="col">المعلم</th><th scope="col">سعر الساعة (جنيه)</th></tr></thead>
          <tbody>
            <template x-for="(t, i) in data.teachers" :key="t.name">
              <tr>
                <th scope="row" x-text="t.name"></th>
                <td>
                  <label :for="'rate-' + i" class="sr-only" x-text="'سعر ساعة ' + t.name + ' بالجنيه'"></label>
                  <input :id="'rate-' + i" type="text" inputmode="decimal" x-model="rates[t.name]"
                         placeholder="لا سعر" class="border border-gray-700 p-1 w-24">
                  <button type="button" class="border border-gray-900 px-2 ms-1 disabled:opacity-50"
                          :disabled="busy || !rates[t.name] || rates[t.name].trim() === String(t.rate)"
                          :aria-label="'احفظ سعر ساعة ' + t.name"
                          @click="saveRate(t)">احفظ</button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
      <div class="mt-4">
        <label for="pay-month" class="font-bold block">شهر المستحقات</label>
        <select id="pay-month" x-model="payMonth" class="border border-gray-700 p-1">
          <template x-for="m in payMonths()" :key="m"><option :value="m" :selected="m === payMonth" x-text="m"></option></template>
        </select>
      </div>
      <div class="overflow-x-auto mt-2" x-show="payRows().length">
        <table class="text-sm">
          <caption x-text="'مستحقات المعلمين في ' + payMonth + ' بالجنيه'"></caption>
          <thead><tr><th scope="col">المعلم</th><th scope="col">الساعات</th><th scope="col">السعر</th><th scope="col">المستحق</th></tr></thead>
          <tbody>
            <template x-for="p in payRows()" :key="p.teacher">
              <tr><th scope="row" x-text="p.teacher"></th><td x-text="p.hours"></td>
                <td x-text="p.rate === '' ? 'لا سعر' : p.rate"></td><td x-text="p.pay === '' ? 'لا سعر' : p.pay"></td></tr>
            </template>
            <tr><th scope="row">المجموع</th><td x-text="payTotal().hours"></td><td></td>
              <td x-text="payTotal().pay"></td></tr>
          </tbody>
        </table>
      </div>
      <p x-show="!payRows().length" class="mt-2">لا حلقات بعد.</p>
    </section>

    <!-- 5. Other expenses -->
    <section id="expenses" aria-labelledby="exp-h" class="mb-8">
      <h2 id="exp-h" tabindex="-1" class="text-xl font-bold mb-2">المصروفات</h2>
      <p class="mb-2">المصروفات الأخرى بالجنيه، غير مستحقات المعلمين. ومصروف الشهر في الأرقام مجموعهما.</p>
      <form @submit.prevent="saveExpense()" class="flex flex-wrap gap-4 items-end">
        <div>
          <label for="exp-month" class="font-bold block">الشهر</label>
          <input id="exp-month" type="month" x-model="expMonth" required class="border border-gray-700 p-1">
        </div>
        <div>
          <label for="exp-amount" class="font-bold block">المبلغ بالجنيه</label>
          <input id="exp-amount" type="text" inputmode="decimal" x-model="expAmount" required class="border border-gray-700 p-1">
        </div>
        <button type="submit" class="border-2 border-gray-900 px-3 py-1 font-bold" :disabled="busy">احفظ المصروف</button>
      </form>
      <p class="mt-1">إن كُتب الشهر من قبل عُدّل مصروفه ولم يتكرر.</p>
      <div class="overflow-x-auto mt-3">
        <table class="text-sm">
          <caption>المصروفات الأخرى في السنة بالجنيه</caption>
          <thead><tr><th scope="col">الشهر</th><th scope="col">المبلغ</th></tr></thead>
          <tbody>
            <template x-for="e in data.expenses" :key="e.month">
              <tr><th scope="row" x-text="e.month"></th><td x-text="e.amount"></td></tr>
            </template>
          </tbody>
        </table>
        <p x-show="!data.expenses.length">لا مصروفات بعد.</p>
      </div>
    </section>
  </div></template>
  </main>
</div>

<script>
  // The page runs inside Google's sandbox frame, where following "#section"
  // loads the frame's blank address instead of scrolling. So in-page links
  // move focus to the section heading (or <main>) themselves.
  document.addEventListener('click', event => {
    const link = event.target.closest('a[href^="#"]');
    if (!link) return;
    event.preventDefault();
    const target = document.getElementById(link.getAttribute('href').slice(1));
    if (!target) return;
    const heading = target.matches('section') ? target.querySelector('h2') : target;
    heading.scrollIntoView({ block: 'start' });
    heading.focus();
  });

  function dashboard() {
    return {
      data: null, status: 'جارٍ تحميل البيانات…', error: '', busy: false, year: '', test: false,
      month: '', teacher: '', search: '', absentDays: '0', genders: {},
      details: {},
      aliasFrom: '', aliasMode: 'list', aliasToList: '', aliasToTyped: '', review: null, pendingDelete: -1,
      rates: {}, payMonth: '',
      expMonth: '', expAmount: '',

      init() {
        const start = (params) => {
          this.year = (params && params.year) || String(new Date().getFullYear());
          this.test = !!(params && params.test === '1');
          this.call('getDashboardData', [this.year], 'حُمّلت البيانات.');
        };
        if (window.google && google.script && google.script.url) {
          google.script.url.getLocation(loc => start(loc.parameter));
        } else {
          start(null);
        }
      },

      call(fn, args, done) {
        this.busy = true;
        this.error = '';
        google.script.run
          .withSuccessHandler(result => {
            this.busy = false;
            const data = result && result.data ? result.data : result;
            this.load(data);
            this.status = typeof done === 'function' ? done(result) : done;
          })
          .withFailureHandler(err => {
            this.busy = false;
            this.status = '';
            this.error = (err && err.message) || String(err);
            this.$nextTick(() => this.focusEl('error'));
          })[fn](...args, this.test);
      },

      load(data) {
        this.data = data;
        this.genders = {};
        this.details = {};
        data.teachers.forEach(t => t.students.forEach(s => {
          this.genders[t.name + '|' + s.key] = s.gender;
          this.details[t.name + '|' + s.key] = { birthYear: String(s.birthYear || ''), phone: s.phone || '' };
        }));
        if (!data.teachers.some(t => t.name === this.teacher)) this.teacher = data.teachers.length ? data.teachers[0].name : '';
        const months = this.months();
        if (months.indexOf(this.month) === -1) this.month = months.length ? months[months.length - 1] : '';
        this.rates = {};
        data.teachers.forEach(t => { this.rates[t.name] = String(t.rate); });
        const payMonths = this.payMonths();
        if (payMonths.indexOf(this.payMonth) === -1) this.payMonth = payMonths.length ? payMonths[payMonths.length - 1] : '';
        this.pendingDelete = -1;
      },

      months() {
        return this.data ? Array.from(new Set(this.data.monthly.map(r => r[0]))).sort() : [];
      },
      monthRows() {
        return this.data ? this.data.monthly.filter(r => r[0] === this.month) : [];
      },
      currentStudents() {
        const t = this.data && this.data.teachers.find(x => x.name === this.teacher);
        return t ? t.students : [];
      },
      // Same matching key as the registry (studentNameKey), so «فاطمه» finds «فاطمة».
      nameKey(name) {
        return String(name || '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي')
          .replace(/[ً-ْٰـ\s]/g, '');
      },
      daysAway(s) {
        if (!s.lastSeen || !this.data) return '';
        return Math.round((Date.parse(this.data.today) - Date.parse(s.lastSeen)) / 86400000);
      },
      filteredStudents() {
        const q = this.nameKey(this.search);
        const min = Number(this.absentDays);
        return this.currentStudents().filter(s =>
          (!q || this.nameKey(s.name).indexOf(q) !== -1) && (!min || this.daysAway(s) > min));
      },
      payMonths() {
        return this.data ? Array.from(new Set(this.data.pay.map(p => p.month))).sort() : [];
      },
      payRows() {
        return this.data ? this.data.pay.filter(p => p.month === this.payMonth) : [];
      },
      payTotal() {
        const rows = this.payRows();
        const hours = Math.round(rows.reduce((a, p) => a + p.hours, 0) * 100) / 100;
        const unpriced = rows.some(p => p.pay === '');
        return { hours, pay: unpriced ? 'ناقص: بعضهم بلا سعر' : rows.reduce((a, p) => a + p.pay, 0) };
      },
      focusEl(id) {
        const el = document.getElementById(id);
        if (el) el.focus();
      },

      // Per teacher and student: two teachers may each have a student of the same name.
      k(s) {
        return this.teacher + '|' + s.key;
      },
      detailsChanged(s) {
        const d = this.details[this.k(s)];
        return !!d && (d.birthYear.trim() !== String(s.birthYear || '') || d.phone.trim() !== (s.phone || ''));
      },
      saveDetails(s) {
        const d = this.details[this.k(s)];
        this.call('dashboardSetDetails', [this.teacher, s.key, { birthYear: d.birthYear, phone: d.phone }, this.year],
          'حُفظت سنة ميلاد ' + s.name + ' وهاتفه.');
      },

      saveGender(s) {
        this.call('dashboardSetGender', [this.teacher, s.key, this.genders[this.k(s)], this.year],
          'حُفظ جنس ' + s.name + ': ' + this.genders[this.k(s)] + '.');
      },

      aliasTo() {
        return (this.aliasMode === 'list' ? this.aliasToList : this.aliasToTyped).trim();
      },
      reviewAlias() {
        const to = this.aliasTo();
        if (!this.aliasFrom || !to) {
          this.error = 'اختر الاسم الخطأ والاسم الصحيح.';
          this.$nextTick(() => this.focusEl('error'));
          return;
        }
        const list = this.currentStudents();
        this.review = {
          from: list.find(s => s.name === this.aliasFrom),
          to: list.find(s => s.name === to) || null,
          toName: to,
        };
        this.$nextTick(() => this.focusEl('alias-review'));
      },
      reviewText() {
        const r = this.review;
        const row = s => 'حضر ' + s.attendance + ' مرة، من ' + s.firstSeen + ' إلى ' + s.lastSeen;
        const from = '«' + r.from.name + '» (' + row(r.from) + ')';
        return r.to
          ? 'سيُدمج ' + from + ' في «' + r.to.name + '» (' + row(r.to) + ')، ويبقى جنس الصحيح وخاناته.'
          : 'لا صف باسم «' + r.toName + '»، فيُعاد تسمية ' + from + ' إليه.';
      },
      confirmAlias() {
        const alias = { teacher: this.teacher, from: this.review.from.name, to: this.review.toName };
        this.review = null;
        this.call('dashboardApplyAlias', [alias, this.year], result => {
          this.aliasFrom = ''; this.aliasToList = ''; this.aliasToTyped = '';
          const word = { merged: 'دُمج', renamed: 'أُعيدت تسمية', absent: 'لم يوجد' }[result.outcome] || result.outcome;
          return word + ' «' + alias.from + '» ← «' + alias.to + '». ويُطبَّق البديل على التقارير الآتية.';
        });
      },
      deleteAlias(a) {
        this.call('dashboardDeleteAlias', [a.teacher, a.from, this.year], 'حُذف البديل «' + a.from + '».');
      },

      saveRate(t) {
        const rate = this.rates[t.name].trim();
        this.call('dashboardSaveRate', [t.name, rate, this.year], 'حُفظ سعر ساعة ' + t.name + ': ' + rate + ' جنيه.');
      },
      saveExpense() {
        this.call('dashboardSaveExpense', [this.expMonth, this.expAmount, this.year],
          'حُفظ مصروف ' + this.expMonth + '.');
      },
    };
  }
</script>
